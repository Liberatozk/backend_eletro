spring.application.name=eletrorecicla

spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost;databaseName=EletroRecicla;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME:eletrorecicla_app}
spring.datasource.password=${DB_PASSWORD}

# Local
#spring.datasource.username=sa
#spring.datasource.password=@ITB123456

spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=${SHOW_SQL:false}

spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# JWT - nunca commitar o secret real. Defina as variaveis de ambiente DB_PASSWORD e JWT_SECRET
# antes de rodar (no IntelliJ: Run > Edit Configurations > Environment variables).
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# Origens do frontend (separadas por vírgula). Em produção: CORS_ALLOWED_ORIGINS com a URL do site.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000}

